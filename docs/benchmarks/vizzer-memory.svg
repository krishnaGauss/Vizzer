<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Vizzer memory by transcript size</title>
<desc id="desc">Column chart of the heap Vizzer uses for transcripts of different sizes.</desc>
<rect x="0.5" y="0.5" width="639" height="399" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
<text x="32" y="40" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">Vizzer memory by transcript size</text>
<text x="32" y="64" font-size="13" fill="#52514e" text-anchor="start">Extra heap to load and track one session, measured in a fresh Node process</text>
<line x1="72" x2="600" y1="336" y2="336" stroke="#c3c2b7" stroke-width="1"/>
<text x="62" y="340" font-size="12" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">0 MB</text>
<line x1="72" x2="600" y1="257.3" y2="257.3" stroke="#e1e0d9" stroke-width="1"/>
<text x="62" y="261.3" font-size="12" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">2 MB</text>
<line x1="72" x2="600" y1="178.7" y2="178.7" stroke="#e1e0d9" stroke-width="1"/>
<text x="62" y="182.7" font-size="12" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">4 MB</text>
<line x1="72" x2="600" y1="100" y2="100" stroke="#e1e0d9" stroke-width="1"/>
<text x="62" y="104" font-size="12" fill="#898781" text-anchor="end" style="font-variant-numeric: tabular-nums">6 MB</text>
<path d="M148,336 V325.6 A4,4 0 0 1 152,321.6 H168 A4,4 0 0 1 172,325.6 V336 Z" fill="#2a78d6"/>
<text x="160" y="313.6" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric: tabular-nums">0.4 MB</text>
<text x="160" y="358" font-size="12" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">1 MB</text>
<path d="M324,336 V290 A4,4 0 0 1 328,286 H344 A4,4 0 0 1 348,290 V336 Z" fill="#2a78d6"/>
<text x="336" y="278" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric: tabular-nums">1.3 MB</text>
<text x="336" y="358" font-size="12" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">10 MB</text>
<path d="M500,336 V133.3 A4,4 0 0 1 504,129.3 H520 A4,4 0 0 1 524,133.3 V336 Z" fill="#2a78d6"/>
<text x="512" y="121.3" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric: tabular-nums">5.3 MB</text>
<text x="512" y="358" font-size="12" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">50 MB</text>
<text x="336" y="382" font-size="12" fill="#52514e" text-anchor="middle">Transcript size on disk</text>
</svg>
